name: iOS
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone simulator app
        run: xcodebuild -project Remember.xcodeproj -scheme Remember -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Test birthday and reminder logic
        run: swift test
      - name: Verify SwiftData survives reopening the store
        run: |
          xcrun swiftc -parse-as-library Remember/Models/Person.swift Remember/Models/ProfileExtras.swift scripts/verify-persistence.swift -o "$RUNNER_TEMP/verify-persistence"
          "$RUNNER_TEMP/verify-persistence" "$RUNNER_TEMP/RememberVerification.store"
      - name: Launch app in iPhone simulator
        run: bash scripts/smoke-simulator.sh
      - name: Test adding Sarah and relaunching
        timeout-minutes: 12
        run: xcodebuild -project Remember.xcodeproj -scheme Remember -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Save launch screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remember-launch
          path: ${{ runner.temp }}/remember-home.png
