<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5C54BF" />
    <title>Remember — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: #f2f2f7; color: #1c1c1e; }
      main { width: min(100%, 420px); padding: 28px; border-radius: 20px; background: #fff; box-shadow: 0 8px 28px rgb(0 0 0 / 5%); }
      img { width: 64px; height: 64px; border-radius: 15px; }
      h1 { margin: 24px 0 8px; font-size: 27px; line-height: 1.2; letter-spacing: -.025em; }
      p { margin: 0; color: #636366; line-height: 1.5; }
      button { display: block; width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 12px; background: #5c54bf; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f2f2f7; } main { background: #2c2c2e; } p { color: #aeaeb2; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Remember is offline</h1>
      <p>Your saved people are stored on this device. If this is the first time opening this page, reconnect once so the app can save it for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
